name: Post Video 16

on:
  schedule:
    - cron: '0 23 11 5 *'  # May 11, 7PM EDT (23:00 UTC)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Post video to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VIDEO_URL: "https://github.com/nagashimakentaro116-hub/julian-autopost/releases/download/v-video-16-20260503213645/16.mp4"
          CAPTION_INDEX: "0"
        run: python post_video_ig.py
